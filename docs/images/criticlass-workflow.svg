<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" width="850" height="166" font-family="Segoe UI, Calibri, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2E6B55"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="180" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Step 1 -->
  <g filter="url(#shadow)">
    <rect x="24" y="28" width="190" height="124" rx="10" fill="#FFFFFF" stroke="#DCE1E7" stroke-width="1.5"/>
    <rect x="24" y="28" width="190" height="34" rx="10" fill="#1F4E3D"/>
    <rect x="24" y="52" width="190" height="10" fill="#1F4E3D"/>
    <text x="119" y="50" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">1. Leitura do Modelo</text>
    <text x="119" y="86" fill="#1E293B" font-size="12" font-weight="600" text-anchor="middle">Diagrama UML (StarUML)</text>
    <text x="119" y="108" fill="#475569" font-size="11" text-anchor="middle">Classes, Interfaces,</text>
    <text x="119" y="124" fill="#475569" font-size="11" text-anchor="middle">Heranças e Acoplamentos</text>
    <text x="119" y="142" fill="#2E6B55" font-size="10" font-weight="600" text-anchor="middle">src/modelReader.js</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="218" y1="90" x2="246" y2="90" stroke="#2E6B55" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <g filter="url(#shadow)">
    <rect x="252" y="28" width="190" height="124" rx="10" fill="#FFFFFF" stroke="#DCE1E7" stroke-width="1.5"/>
    <rect x="252" y="28" width="190" height="34" rx="10" fill="#1F4E3D"/>
    <rect x="252" y="52" width="190" height="10" fill="#1F4E3D"/>
    <text x="347" y="50" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">2. Extração de Métricas</text>
    <text x="347" y="86" fill="#1E293B" font-size="12" font-weight="600" text-anchor="middle">18 Indicadores OO</text>
    <text x="347" y="108" fill="#475569" font-size="11" text-anchor="middle">Chidamber &amp; Kemerer (C&amp;K)</text>
    <text x="347" y="124" fill="#475569" font-size="11" text-anchor="middle">Lorenz &amp; Kidd (L&amp;K)</text>
    <text x="347" y="142" fill="#2E6B55" font-size="10" font-weight="600" text-anchor="middle">src/metrics/ck.js | lk.js</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="446" y1="90" x2="474" y2="90" stroke="#2E6B55" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <g filter="url(#shadow)">
    <rect x="480" y="28" width="190" height="124" rx="10" fill="#FFFFFF" stroke="#DCE1E7" stroke-width="1.5"/>
    <rect x="480" y="28" width="190" height="34" rx="10" fill="#1F4E3D"/>
    <rect x="480" y="52" width="190" height="10" fill="#1F4E3D"/>
    <text x="575" y="50" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">3. Normalização &amp; Score</text>
    <text x="575" y="86" fill="#1E293B" font-size="12" font-weight="600" text-anchor="middle">Escala Min-Max [0, 1]</text>
    <text x="575" y="108" fill="#475569" font-size="11" text-anchor="middle">Média Ponderada Configurável</text>
    <text x="575" y="124" fill="#475569" font-size="11" text-anchor="middle">Ranking de Criticidade</text>
    <text x="575" y="142" fill="#2E6B55" font-size="10" font-weight="600" text-anchor="middle">normalizer.js | prioritizer.js</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="674" y1="90" x2="702" y2="90" stroke="#2E6B55" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <g filter="url(#shadow)">
    <rect x="708" y="28" width="188" height="124" rx="10" fill="#FFFDF7" stroke="#E5A93C" stroke-width="1.8"/>
    <rect x="708" y="28" width="188" height="34" rx="10" fill="#D97706"/>
    <rect x="708" y="52" width="188" height="10" fill="#D97706"/>
    <text x="802" y="50" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">4. Priorização &amp; Relatório</text>
    <text x="802" y="85" fill="#7A4F01" font-size="12" font-weight="700" text-anchor="middle">Destaque ALTA (Top 20%)</text>
    <text x="802" y="108" fill="#475569" font-size="11" text-anchor="middle">Planilha .XLSX Estilizada</text>
    <text x="802" y="124" fill="#475569" font-size="11" text-anchor="middle">(Métricas, Priorização, Legenda)</text>
    <text x="802" y="142" fill="#B45309" font-size="10" font-weight="600" text-anchor="middle">src/exporter.js</text>
  </g>
</svg>

